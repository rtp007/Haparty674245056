<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>โปรไฟล์ | Ha Party</title>
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <header class="navbar">
      <div class="container nav-inner">
        <a class="logo" href="/">Ha <span>Party</span></a>
        <nav id="navActions" class="nav-actions"></nav>
      </div>
    </header>
    <main class="page-main">
      <div class="container form-layout">
        <span class="eyebrow">YOUR ACCOUNT</span>
        <h1 class="page-title">จัดการโปรไฟล์</h1>
        <p class="page-subtitle">แก้ไขชื่อผู้ใช้และอีเมลของคุณ</p>
        <section class="panel">
          <div id="message" class="notice hidden"></div>
          <form id="profileForm" class="form-grid">
            <div class="form-group">
              <label>ชื่อผู้ใช้</label
              ><input
                class="form-control"
                name="username"
                minlength="3"
                required
              />
            </div>
            <div class="form-group">
              <label>อีเมล</label
              ><input class="form-control" name="email" type="email" required />
            </div>
            <div class="form-group full">
              <button class="btn btn-primary">บันทึกข้อมูล</button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <script src="/profile.js"></script>
  </body>
</html>
